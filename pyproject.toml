[project]
name = "dicta"
version = "0.1.0"
description = "Dictado por voz local (Whisper) para Claude Code en Windows"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "faster-whisper>=1.1",
    "sounddevice>=0.4.6",
    "numpy",
    "pywin32>=306",
    "keyboard>=0.13",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dicta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
