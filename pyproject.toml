[project]
name = "dicta"
version = "0.1.0"
description = "Dictado por voz local (Whisper) para Claude Code (Windows y macOS)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "faster-whisper>=1.1",
    "sounddevice>=0.4.6",
    "numpy",
    "vosk>=0.3.45",
    # Windows: ventanas/clipboard/teclado y hotkey global
    "pywin32>=306; sys_platform == 'win32'",
    "keyboard>=0.13; sys_platform == 'win32'",
    # macOS: app frontal (AppKit) + envío de Cmd+V (pynput)
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pynput>=1.7; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dicta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
